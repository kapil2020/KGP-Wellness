<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ page.title | default: site.title }}</title>
<link rel="preconnect" href="https://cdn.jsdelivr.net" crossorigin>
<script src="https://cdn.jsdelivr.net/npm/mermaid@10/dist/mermaid.min.js" integrity="sha384-u3ZNq2zw9myLdZ0QIHlsplBz76X3wE7zkfa3/W22zYubXz6lZ/d0qpTuAyKuJz2r" crossorigin="anonymous"></script>
<script>
  document.addEventListener("DOMContentLoaded", function () {
    var mermaidBlocks = document.querySelectorAll("pre code.language-mermaid");

    mermaidBlocks.forEach(function (codeBlock) {
      var pre = codeBlock.parentElement;
      if (!pre) {
        return;
      }

      var container = document.createElement("div");
      container.className = "mermaid";
      container.textContent = codeBlock.textContent;
      pre.replaceWith(container);
    });

    if (window.mermaid) {
      window.mermaid.initialize({ startOnLoad: false, securityLevel: "loose", theme: "default" });
      window.mermaid.init(undefined, document.querySelectorAll(".mermaid"));
    }
  });
</script>
