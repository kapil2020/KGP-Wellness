<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    <style>
      body {
        margin: 0 auto;
        padding: 2rem 1.5rem 4rem;
        max-width: 960px;
        font-family: "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.6;
        color: #1f2933;
        background-color: #f8fafc;
      }

      pre, code {
        font-family: "Fira Code", "Source Code Pro", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      pre {
        padding: 1rem;
        overflow-x: auto;
        background: #111827;
        color: #f3f4f6;
        border-radius: 0.5rem;
      }

      h1, h2, h3, h4 {
        color: #0f172a;
      }

      a {
        color: #2563eb;
      }

      .mermaid {
        margin: 2rem 0;
        background: #fff;
        border-radius: 0.5rem;
        box-shadow: 0 10px 25px rgba(15, 23, 42, 0.1);
        padding: 1rem;
      }
    </style>
  </head>
  <body>
    <main>
      {{ content }}
    </main>
  </body>
</html>
