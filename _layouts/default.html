<!DOCTYPE html>
<html lang="en">
  <head>
    {% include head.html %}
    <style>
      :root {
        color-scheme: light;
      }

      *, *::before, *::after {
        box-sizing: border-box;
      }

      body {
        margin: 0;
        font-family: "Inter", "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
        line-height: 1.65;
        color: #0f172a;
        background: linear-gradient(180deg, #f8fafc 0%, #eef2ff 100%);
      }

      main {
        max-width: 1080px;
        margin: 0 auto;
        padding: 3rem 1.5rem 5rem;
      }

      .page {
        background: #ffffff;
        border-radius: 1.5rem;
        box-shadow: 0 40px 70px -45px rgba(15, 23, 42, 0.45);
        padding: 3rem clamp(1.5rem, 2.5vw, 3rem) 4rem;
      }

      @media (max-width: 720px) {
        .page {
          padding: 2.25rem 1.25rem 3rem;
          border-radius: 1rem;
        }
      }

      h1 {
        font-size: clamp(2.25rem, 4vw, 3rem);
        line-height: 1.1;
        margin-top: 0;
        color: #0f172a;
      }

      h2 {
        margin-top: 3rem;
        margin-bottom: 1rem;
        font-size: clamp(1.65rem, 3vw, 2rem);
      }

      h3 {
        margin-top: 2rem;
        margin-bottom: 0.75rem;
        font-size: clamp(1.25rem, 2.2vw, 1.45rem);
      }

      h4 {
        margin-top: 1.75rem;
        margin-bottom: 0.65rem;
        font-size: 1.1rem;
      }

      p {
        margin-top: 0;
        margin-bottom: 1rem;
        color: #1f2937;
      }

      ul, ol {
        padding-left: 1.2rem;
      }

      li + li {
        margin-top: 0.35rem;
      }

      a {
        color: #2563eb;
        text-decoration: none;
      }

      a:hover {
        text-decoration: underline;
      }

      hr {
        border: none;
        border-top: 1px solid #e2e8f0;
        margin: 3rem 0;
      }

      table {
        width: 100%;
        border-collapse: collapse;
        margin: 1.5rem 0;
      }

      th, td {
        border: 1px solid #e2e8f0;
        padding: 0.75rem 1rem;
        text-align: left;
      }

      th {
        background: #f1f5f9;
        font-weight: 600;
      }

      pre, code {
        font-family: "Fira Code", "Source Code Pro", Menlo, Monaco, Consolas, "Liberation Mono", "Courier New", monospace;
      }

      pre {
        padding: 1.25rem;
        overflow-x: auto;
        background: #111827;
        color: #f9fafb;
        border-radius: 0.85rem;
        font-size: 0.9rem;
      }

      code:not(pre code) {
        padding: 0.15rem 0.4rem;
        border-radius: 0.35rem;
        background: #e0e7ff;
        color: #1e3a8a;
        font-size: 0.85rem;
      }

      .mermaid {
        margin: 2.5rem 0;
        background: #f8fafc;
        border-radius: 1rem;
        box-shadow: inset 0 0 0 1px rgba(148, 163, 184, 0.35);
        padding: 1.5rem;
      }

      .page-hero {
        background: radial-gradient(circle at top left, rgba(37, 99, 235, 0.15), transparent 60%),
          linear-gradient(120deg, rgba(37, 99, 235, 0.1), rgba(59, 130, 246, 0.05));
        border-radius: 1.25rem;
        padding: 2.5rem clamp(1.5rem, 2vw, 2.5rem);
        margin-bottom: 2.5rem;
      }

      .hero-eyebrow {
        font-size: 0.85rem;
        font-weight: 700;
        letter-spacing: 0.16rem;
        text-transform: uppercase;
        color: #1d4ed8;
        margin-bottom: 0.75rem;
      }

      .hero-lede {
        font-size: clamp(1.15rem, 2vw, 1.35rem);
        max-width: 48ch;
        color: #1f2937;
      }

      .hero-tags {
        display: flex;
        flex-wrap: wrap;
        gap: 0.65rem;
        margin-top: 1.75rem;
      }

      .hero-tag {
        display: inline-flex;
        align-items: center;
        gap: 0.35rem;
        background: rgba(37, 99, 235, 0.08);
        border: 1px solid rgba(37, 99, 235, 0.22);
        padding: 0.45rem 0.85rem;
        border-radius: 999px;
        font-weight: 600;
        font-size: 0.9rem;
        color: #1d4ed8;
      }

      .callout {
        border-radius: 1rem;
        border-left: 6px solid #2563eb;
        background: #eff6ff;
        padding: 1.15rem 1.5rem;
        margin: 2.5rem 0;
      }

      .stat-grid {
        display: grid;
        grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
        gap: 1rem;
        margin-top: 1.5rem;
      }

      .stat-card {
        background: #f8fafc;
        border-radius: 1rem;
        padding: 1.1rem 1.25rem;
        border: 1px solid rgba(148, 163, 184, 0.35);
      }

      .stat-card strong {
        display: block;
        font-size: 1.4rem;
        color: #1e3a8a;
      }

      blockquote {
        margin: 2rem 0;
        padding: 1.25rem 1.5rem;
        background: #f1f5f9;
        border-left: 4px solid #2563eb;
        color: #1f2937;
        border-radius: 0.75rem;
      }

      @media (max-width: 540px) {
        .hero-tags {
          flex-direction: column;
          align-items: flex-start;
        }
      }
    </style>
  </head>
  <body>
    <main>
      <article class="page">
        {{ content }}
      </article>
    </main>
  </body>
</html>
